<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dodge Dots</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #db8c00;
  font-family: Arial, sans-serif;
  color: white;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

#game {
  width: min(1000px, 96vw);
  text-align: center;
}

#header {
  display: flex;
  justify-content: space-between;
  padding: 0 20px;
  margin-bottom: 15px;
  font-size: 15px;
}

#canvas {
  width: 100%;
  display: block;
  aspect-ratio: 16 / 9;
}

#controls {
  margin-top: 15px;
  font-size: 13px;
  color: white;
}

button {
  background: transparent;
  border: 1px solid white;
  color: white;
  padding: 10px 25px;
  margin: 5px;
  cursor: pointer;
}

button:hover {
  background: white;
  color: #db8c00;
}

#message {
  font-size: 18px;
  margin-top: 10px;
  min-height: 25px;
}

</style>
</head>

<body>

<div id="game">

  <div id="header">
    <span>Score: <b id="score">0</b></span>
    <span>Best: <b id="best">0</b></span>
  </div>

  <canvas id="canvas" width="1200" height="675"></canvas>

  <div id="message"></div>

  <div id="controls">
    MOVE : WASD / ARROW KEYS　
    SOUND : M
  </div>

  <div>
    <button onclick="restart()">RESTART</button>
    <button onclick="toggleSound()">SOUND ON / OFF</button>
    <button onclick="togglePause()">PAUSE</button>
  </div>

</div>

<script>

// =====================================
// 基本設定
// =====================================

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const W = 1200;
const H = 675;

const BOARD_SIZE = 360;
const CELL = BOARD_SIZE / 3;
const DOT_SIZE = 70;
const DOT_RADIUS = DOT_SIZE / 2;

const board = {
  x: (W - BOARD_SIZE) / 2,
  y: (H - BOARD_SIZE) / 2,
  size: BOARD_SIZE
};

// マスの中心座標
function cellPosition(x, y) {
  return {
    x: board.x + CELL * (x + 0.5),
    y: board.y + CELL * (y + 0.5)
  };
}

// =====================================
// ゲーム状態
// =====================================

let player = {
  x: 1,
  y: 1
};

let enemies = [];
let item = { x: 0, y: 0 };

let score = 0;
let best = Number(localStorage.getItem("dodgeBest")) || 0;

let playing = true;
let paused = false;
let sound = true;

let lastTime = 0;
let animationId = 0;

document.getElementById("best").textContent = best;


// =====================================
// 音声
// =====================================

let audio;

function playSound(freq = 500) {
  if (!sound) return;

  try {
    audio ??= new AudioContext();

    const osc = audio.createOscillator();
    const gain = audio.createGain();

    osc.frequency.value = freq;
    gain.gain.value = 0.06;

    osc.connect(gain);
    gain.connect(audio.destination);

    osc.start();

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audio.currentTime + 0.15
    );

    osc.stop(audio.currentTime + 0.15);

  } catch (e) {}
}

function toggleSound() {
  sound = !sound;
}


// =====================================
// 敵の生成
// =====================================

function createEnemy(axis, lane, direction, speed, position) {

  return {
    axis: axis,

    // 横移動なら行、縦移動なら列
    lane: lane,

    // 1 = 正方向、-1 = 逆方向
    direction: direction,

    speed: speed,

    // 盤面の端からの距離
    position: position,

    radius: DOT_RADIUS
  };
}


// =====================================
// アイテム生成
// =====================================

function spawnItem() {

  let positions = [];

  for (let y = 0; y < 3; y++) {
    for (let x = 0; x < 3; x++) {

      // 中央のマスには出現させない
      if (x === 1 && y === 1) continue;

      // プレイヤーの位置には出さない
      if (x === player.x && y === player.y) continue;

      const occupiedByEnemy = enemies.some(e => {
        if (e.axis === "horizontal") {
          return e.lane === y;
        }

        return e.lane === x;
      });

      positions.push({
        x,
        y,
        occupiedByEnemy
      });
    }
  }

  let safe = positions.filter(p => !p.occupiedByEnemy);

  if (safe.length === 0) safe = positions;

  const p = safe[Math.floor(Math.random() * safe.length)];

  item.x = p.x;
  item.y = p.y;
}


// =====================================
// ゲーム初期化
// =====================================

function restart() {

  cancelAnimationFrame(animationId);

  score = 0;
  playing = true;
  paused = false;

  player.x = 1;
  player.y = 1;

  enemies = [];

  // 最初の敵：上の行を横断
  enemies.push(
    createEnemy(
      "horizontal",
      0,
      1,
      100,
      -DOT_RADIUS
    )
  );

  // 最初の敵：右の列を縦断
  enemies.push(
    createEnemy(
      "vertical",
      2,
      -1,
      115,
      CELL * 3 + DOT_RADIUS
    )
  );

  // アイテム配置
  spawnItem();

  document.getElementById("score").textContent = 0;
  document.getElementById("message").textContent = "";

  lastTime = 0;

  draw();

  animationId = requestAnimationFrame(loop);
}


// =====================================
// プレイヤーの移動
// =====================================

function movePlayer(dx, dy) {

  if (!playing || paused) return;

  const nx = player.x + dx;
  const ny = player.y + dy;

  // 盤面の外には移動できない
  if (nx < 0 || nx > 2 || ny < 0 || ny > 2) {
    return;
  }

  // 1マスだけ移動
  player.x = nx;
  player.y = ny;

  playSound(400);

  // アイテム取得
  if (player.x === item.x && player.y === item.y) {

    score++;

    document.getElementById("score").textContent = score;

    playSound(800);

    // 5点ごとに敵を追加
    if (score % 5 === 0) {
      addEnemy();
    }

    // 敵の速度を少しずつ上昇
    enemies.forEach(e => {
      e.speed = Math.min(200, e.speed + 3);
    });

    spawnItem();
  }

  // 移動先に敵がいたら終了
  checkCollision();

  draw();
}


// =====================================
// 敵の追加
// =====================================

function addEnemy() {

  const axis = Math.random() < 0.5
    ? "horizontal"
    : "vertical";

  const lane = Math.floor(Math.random() * 3);

  const direction = Math.random() < 0.5 ? 1 : -1;

  const start = direction === 1
    ? -DOT_RADIUS
    : CELL * 3 + DOT_RADIUS;

  enemies.push(
    createEnemy(
      axis,
      lane,
      direction,
      100 + score * 2,
      start
    )
  );
}


// =====================================
// 敵の移動
// =====================================

function updateEnemies(dt) {

  enemies.forEach(e => {

    // 横方向
    if (e.axis === "horizontal") {

      e.position += e.direction * e.speed * dt;

      // 右端を越えたら左端から再登場
      if (e.direction === 1 &&
          e.position > BOARD_SIZE + DOT_RADIUS) {

        e.position = -DOT_RADIUS;
      }

      // 左端を越えたら右端から再登場
      if (e.direction === -1 &&
          e.position < -DOT_RADIUS) {

        e.position = BOARD_SIZE + DOT_RADIUS;
      }

    }

    // 縦方向
    else {

      e.position += e.direction * e.speed * dt;

      if (e.direction === 1 &&
          e.position > BOARD_SIZE + DOT_RADIUS) {

        e.position = -DOT_RADIUS;
      }

      if (e.direction === -1 &&
          e.position < -DOT_RADIUS) {

        e.position = BOARD_SIZE + DOT_RADIUS;
      }
    }

  });

}


// =====================================
// 敵の現在座標
// =====================================

function getEnemyPosition(e) {

  if (e.axis === "horizontal") {

    return {
      x: board.x + e.position,
      y: board.y + CELL * (e.lane + 0.5)
    };

  }

  return {
    x: board.x + CELL * (e.lane + 0.5),
    y: board.y + e.position
  };
}


// =====================================
// 当たり判定
// =====================================

function checkCollision() {

  const p = cellPosition(player.x, player.y);

  for (const e of enemies) {

    const ep = getEnemyPosition(e);

    const d = Math.hypot(
      p.x - ep.x,
      p.y - ep.y
    );

    if (d < DOT_RADIUS * 2) {

      gameOver();
      return;
    }

  }

}


// =====================================
// ゲーム終了
// =====================================

function gameOver() {

  if (!playing) return;

  playing = false;

  playSound(150);

  if (score > best) {

    best = score;

    localStorage.setItem("dodgeBest", best);

    document.getElementById("best").textContent = best;
  }

  document.getElementById("message").textContent =
    "GAME OVER - SCORE: " + score;

}


// =====================================
// ポーズ
// =====================================

function togglePause() {

  if (!playing) return;

  paused = !paused;

  document.getElementById("message").textContent =
    paused ? "PAUSED" : "";

  lastTime = 0;
}


// =====================================
// 描画
// =====================================

function draw() {

  // 背景
  ctx.fillStyle = "#db8c00";
  ctx.fillRect(0, 0, W, H);


  // -----------------------------------
  // 盤面
  // -----------------------------------

  ctx.strokeStyle = "rgba(255,255,255,.95)";
  ctx.lineWidth = 5;

  ctx.strokeRect(
    board.x,
    board.y,
    BOARD_SIZE,
    BOARD_SIZE
  );


  // 縦線と横線
  ctx.lineWidth = 3;

  for (let i = 1; i < 3; i++) {

    const pos = board.x + CELL * i;

    ctx.beginPath();
    ctx.moveTo(pos, board.y);
    ctx.lineTo(pos, board.y + BOARD_SIZE);
    ctx.stroke();

    const posY = board.y + CELL * i;

    ctx.beginPath();
    ctx.moveTo(board.x, posY);
    ctx.lineTo(board.x + BOARD_SIZE, posY);
    ctx.stroke();

  }


  // -----------------------------------
  // 青いアイテム
  // -----------------------------------

  const ip = cellPosition(item.x, item.y);

  ctx.fillStyle = "#174cff";

  ctx.fillRect(
    ip.x - 31,
    ip.y - 31,
    62,
    62
  );


  // -----------------------------------
  // 黒い敵
  // -----------------------------------

  enemies.forEach(e => {

    const p = getEnemyPosition(e);

    ctx.fillStyle = "#050505";

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      DOT_RADIUS,
      0,
      Math.PI * 2
    );

    ctx.fill();

  });


  // -----------------------------------
  // 白いプレイヤー
  // -----------------------------------

  const pp = cellPosition(player.x, player.y);

  ctx.fillStyle = "#ffffff";

  ctx.beginPath();

  ctx.arc(
    pp.x,
    pp.y,
    DOT_RADIUS,
    0,
    Math.PI * 2
  );

  ctx.fill();


  // -----------------------------------
  // ゲームオーバー
  // -----------------------------------

  if (!playing) {

    ctx.fillStyle = "rgba(0,0,0,.65)";

    ctx.fillRect(
      board.x,
      board.y,
      BOARD_SIZE,
      BOARD_SIZE
    );

    ctx.fillStyle = "white";
    ctx.textAlign = "center";

    ctx.font = "bold 34px Arial";

    ctx.fillText(
      "GAME OVER",
      W / 2,
      H / 2 - 10
    );

    ctx.font = "20px Arial";

    ctx.fillText(
      "SCORE : " + score,
      W / 2,
      H / 2 + 30
    );

    ctx.font = "15px Arial";

    ctx.fillText(
      "PRESS ENTER TO RESTART",
      W / 2,
      H / 2 + 65
    );

  }

}


// =====================================
// メインループ
// =====================================

function loop(timestamp) {

  if (!playing || paused) {
    draw();
    return;
  }

  if (!lastTime) lastTime = timestamp;

  const dt = Math.min(
    (timestamp - lastTime) / 1000,
    0.05
  );

  lastTime = timestamp;

  // 敵は決まった直線上を移動
  updateEnemies(dt);

  // 当たり判定
  checkCollision();

  draw();

  if (playing && !paused) {
    animationId = requestAnimationFrame(loop);
  }

}


// =====================================
// キーボード
// =====================================

document.addEventListener("keydown", e => {

  const key = e.key.toLowerCase();

  if (
    ["arrowup", "arrowdown", "arrowleft", "arrowright"].includes(key)
  ) {
    e.preventDefault();
  }

  if (key === "enter" && !playing) {
    restart();
    return;
  }

  if (key === "p" || key === "escape") {
    togglePause();
    return;
  }

  if (key === "m") {
    toggleSound();
    return;
  }

  if (e.repeat) return;

  switch (key) {

    case "arrowup":
    case "w":
      movePlayer(0, -1);
      break;

    case "arrowdown":
    case "s":
      movePlayer(0, 1);
      break;

    case "arrowleft":
    case "a":
      movePlayer(-1, 0);
      break;

    case "arrowright":
    case "d":
      movePlayer(1, 0);
      break;

  }

});


// =====================================
// 開始
// =====================================

restart();

</script>

</body>
</html>
```
